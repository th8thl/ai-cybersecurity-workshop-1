<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Trust Boundaries in the Chatbot</title>
  <desc id="desc">Data-flow diagram showing where untrusted input crosses into trusted application code and where model output returns to the browser.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#147d92"/>
    </marker>
    <style>
      .bg{fill:#f4f1e8}
      .panel{fill:#fffdf7;stroke:#cfcec3;stroke-width:2;rx:18}
      .trusted{fill:#e6eee9;stroke:#147d92;stroke-width:3;rx:18}
      .untrusted{fill:#fde5de;stroke:#c94f3d;stroke-width:3;rx:18}
      .boundary{fill:none;stroke:#ee7b45;stroke-width:4;stroke-dasharray:12 8}
      .title{font:800 34px Segoe UI,Arial,sans-serif;fill:#17212b}
      .label{font:800 23px Segoe UI,Arial,sans-serif;fill:#17212b}
      .body{font:500 18px Segoe UI,Arial,sans-serif;fill:#17212b}
      .mono{font:700 16px Consolas,monospace;fill:#096478}
      .arrow{stroke:#147d92;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text x="60" y="60" class="title">Trust boundaries: where data changes trust level</text>
  <text x="60" y="92" class="body">The important failure is not that a user typed an attack. The failure is that the app treated it as trusted policy.</text>

  <rect x="70" y="175" width="220" height="120" class="untrusted"/>
  <text x="100" y="218" class="label">Browser</text>
  <text x="100" y="252" class="body">Untrusted message</text>

  <rect x="390" y="175" width="220" height="120" class="trusted"/>
  <text x="420" y="218" class="label">Django view</text>
  <text x="420" y="252" class="body">Trusted code</text>

  <rect x="710" y="175" width="220" height="120" class="trusted"/>
  <text x="740" y="218" class="label">AI client</text>
  <text x="740" y="252" class="body">Builds prompt</text>

  <rect x="390" y="445" width="220" height="120" class="panel"/>
  <text x="420" y="488" class="label">Model output</text>
  <text x="420" y="522" class="body">Validate before use</text>

  <rect x="710" y="445" width="220" height="120" class="panel"/>
  <text x="740" y="488" class="label">Template</text>
  <text x="740" y="522" class="body">Rendered HTML</text>

  <rect x="330" y="130" width="660" height="210" class="boundary"/>
  <text x="350" y="365" class="mono">trusted application boundary</text>

  <path class="arrow" d="M290 235 C335 235 350 235 390 235"/>
  <path class="arrow" d="M610 235 C655 235 670 235 710 235"/>
  <path class="arrow" d="M820 295 C780 365 700 420 610 485"/>
  <path class="arrow" d="M610 505 C655 505 670 505 710 505"/>
  <path class="arrow" d="M710 555 C480 640 240 565 180 295"/>
</svg>
