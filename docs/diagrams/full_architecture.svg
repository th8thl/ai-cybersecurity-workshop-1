<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Session 1 Prompt Injection Playground architecture</title>
  <desc id="desc">Architecture diagram showing user input through the browser, Django application, prompt files, SQLite chat history, environment secrets, and mock, Qwen, and Gemini providers with trust boundaries and guardrail locations.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#243447"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d66b32"/>
    </marker>
    <style>
      .bg{fill:#f7f8fa}
      .zone{fill:#ffffff;stroke:#b9c2cc;stroke-width:2}
      .boundary{fill:none;stroke:#d66b32;stroke-width:4;stroke-dasharray:12 10}
      .boundary-label{font:700 15px "Segoe UI",Arial,sans-serif;fill:#a94d22}
      .zone-title{font:700 20px "Segoe UI",Arial,sans-serif;fill:#243447}
      .node{fill:#ffffff;stroke:#667789;stroke-width:2}
      .node-soft{fill:#eef6f8;stroke:#2f8ea2;stroke-width:2}
      .node-risk{fill:#fff4eb;stroke:#d66b32;stroke-width:2}
      .node-data{fill:#f3f0ff;stroke:#7968b8;stroke-width:2}
      .node-secret{fill:#fff7d6;stroke:#b68b00;stroke-width:2}
      .node-guard{fill:#eaf7ef;stroke:#33835a;stroke-width:2}
      .title{font:800 30px "Segoe UI",Arial,sans-serif;fill:#17212b}
      .subtitle{font:400 16px "Segoe UI",Arial,sans-serif;fill:#5c6b78}
      .h{font:700 17px "Segoe UI",Arial,sans-serif;fill:#17212b}
      .body{font:400 13px "Segoe UI",Arial,sans-serif;fill:#334455}
      .small{font:400 12px "Segoe UI",Arial,sans-serif;fill:#52616f}
      .mono{font:600 12px Consolas,"Courier New",monospace;fill:#243447}
      .label{font:700 12px "Segoe UI",Arial,sans-serif;fill:#52616f}
      .line{stroke:#243447;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .line-soft{stroke:#6b7885;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .line-orange{stroke:#d66b32;stroke-width:2.5;fill:none;marker-end:url(#arrow-orange)}
      .legend-label{font:600 13px "Segoe UI",Arial,sans-serif;fill:#243447}
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <text x="54" y="54" class="title">Prompt Injection Playground: Full Architecture</text>
  <text x="54" y="80" class="subtitle">One reusable map for request flow, trust boundaries, protected assets, provider differences, and guardrail placement.</text>

  <rect x="36" y="112" width="272" height="636" rx="16" class="zone"/>
  <text x="60" y="144" class="zone-title">User device</text>

  <rect x="62" y="190" width="110" height="84" rx="12" class="node-risk"/>
  <text x="82" y="222" class="h">User</text>
  <text x="82" y="248" class="body">Message</text>
  <text x="82" y="268" class="small">untrusted</text>

  <rect x="62" y="332" width="220" height="268" rx="14" class="node"/>
  <text x="86" y="364" class="h">Browser UI</text>
  <text x="86" y="390" class="body">Chat input</text>
  <text x="86" y="412" class="body">Provider dropdown</text>
  <text x="86" y="434" class="body">Debug toggle</text>
  <rect x="86" y="466" width="172" height="92" rx="10" class="node-soft"/>
  <text x="104" y="494" class="h">Rendered output</text>
  <text x="104" y="520" class="body">Assistant response</text>
  <text x="104" y="542" class="body">Rendered prompt</text>

  <rect x="354" y="112" width="640" height="636" rx="16" class="zone"/>
  <text x="378" y="144" class="zone-title">Local Django application</text>
  <text x="720" y="144" class="subtitle">starter/ or solution/</text>

  <rect x="382" y="190" width="164" height="96" rx="12" class="node"/>
  <text x="404" y="222" class="h">URL routes</text>
  <text x="404" y="248" class="mono">chatbot/urls.py</text>
  <text x="404" y="270" class="body">/chat/</text>

  <rect x="600" y="190" width="180" height="104" rx="12" class="node"/>
  <text x="622" y="222" class="h">Django view</text>
  <text x="622" y="248" class="mono">chatbot/views.py</text>
  <text x="622" y="270" class="body">Request handling</text>
  <text x="622" y="290" class="body">Session state</text>

  <rect x="830" y="190" width="132" height="104" rx="12" class="node-guard"/>
  <text x="852" y="222" class="h">Input guard</text>
  <text x="852" y="248" class="mono">prompt_</text>
  <text x="852" y="266" class="mono">security.py</text>
  <text x="852" y="286" class="small">solution</text>

  <rect x="600" y="382" width="180" height="122" rx="12" class="node-soft"/>
  <text x="622" y="414" class="h">AI client</text>
  <text x="622" y="440" class="mono">chatbot/ai_client.py</text>
  <text x="622" y="462" class="body">Builds prompt</text>
  <text x="622" y="484" class="body">Selects provider</text>

  <rect x="830" y="382" width="132" height="104" rx="12" class="node-secret"/>
  <text x="852" y="414" class="h">Local config</text>
  <text x="852" y="440" class="mono">.env</text>
  <text x="852" y="462" class="small">API keys</text>

  <rect x="382" y="600" width="164" height="96" rx="12" class="node-data"/>
  <text x="404" y="632" class="h">SQLite DB</text>
  <text x="404" y="658" class="mono">db.sqlite3</text>
  <text x="404" y="680" class="body">chat history</text>

  <rect x="600" y="600" width="164" height="96" rx="12" class="node-data"/>
  <text x="622" y="632" class="h">Prompt files</text>
  <text x="622" y="658" class="mono">prompts/*.txt</text>
  <text x="622" y="680" class="body">templates</text>

  <rect x="818" y="600" width="164" height="96" rx="12" class="node-guard"/>
  <text x="840" y="632" class="h">Output</text>
  <text x="840" y="654" class="h">redaction</text>
  <text x="840" y="680" class="small">before display</text>

  <rect x="1042" y="112" width="522" height="636" rx="16" class="zone"/>
  <text x="1066" y="144" class="zone-title">Model providers</text>

  <rect x="1080" y="190" width="184" height="96" rx="12" class="node"/>
  <text x="1102" y="222" class="h">Mock provider</text>
  <text x="1102" y="248" class="mono">MockChatClient</text>
  <text x="1102" y="270" class="body">Hardcoded local</text>

  <rect x="1328" y="190" width="184" height="96" rx="12" class="node"/>
  <text x="1350" y="222" class="h">Qwen / Ollama</text>
  <text x="1350" y="248" class="mono">localhost:11434</text>
  <text x="1350" y="270" class="body">Self-hosted local</text>

  <rect x="1204" y="408" width="184" height="112" rx="12" class="node"/>
  <text x="1226" y="440" class="h">Gemini</text>
  <text x="1226" y="466" class="mono">Google API</text>
  <text x="1226" y="488" class="body">Managed provider</text>
  <text x="1226" y="510" class="body">Uses GEMINI_API_KEY</text>

  <rect x="1080" y="600" width="432" height="74" rx="12" class="node-risk"/>
  <text x="1102" y="632" class="h">Model response is untrusted output</text>
  <text x="1102" y="658" class="body">The app validates/redacts before display and storage.</text>

  <rect x="334" y="98" width="680" height="668" rx="20" class="boundary"/>
  <text x="638" y="99" class="boundary-label">Application trust boundary</text>

  <rect x="1042" y="98" width="522" height="668" rx="20" class="boundary"/>
  <text x="1212" y="99" class="boundary-label">Provider / runtime boundary</text>

  <path d="M172 232 L204 232 L204 332" class="line-orange"/>
  <text x="192" y="222" class="label">typed into UI</text>

  <path d="M282 382 L334 382 L334 238 L382 238" class="line"/>
  <path d="M546 238 L600 238" class="line"/>
  <path d="M780 238 L830 238" class="line-orange"/>
  <path d="M896 294 L896 332 L690 332 L690 382" class="line"/>
  <path d="M780 443 L1042 443" class="line"/>
  <path d="M1080 637 L982 637" class="line-orange"/>

  <path d="M818 696 L818 728 L334 728 L334 512 L282 512" class="line"/>

  <path d="M600 270 L560 270 L560 648 L546 648" class="line-soft"/>
  <path d="M690 504 L690 600" class="line-soft"/>
  <path d="M830 434 L780 434" class="line-soft"/>

  <text x="1018" y="430" class="label">provider request</text>
  <text x="906" y="546" class="label">provider response</text>
  <text x="344" y="372" class="label">HTTP request</text>
  <text x="344" y="500" class="label">UI update</text>

  <rect x="58" y="802" width="1484" height="58" rx="14" class="zone"/>
  <rect x="86" y="822" width="18" height="18" class="node-risk"/>
  <text x="114" y="837" class="legend-label">Untrusted or sensitive</text>
  <rect x="300" y="822" width="18" height="18" class="node-guard"/>
  <text x="328" y="837" class="legend-label">Guardrail</text>
  <rect x="438" y="822" width="18" height="18" class="node-data"/>
  <text x="466" y="837" class="legend-label">Local data</text>
  <rect x="588" y="822" width="18" height="18" class="node-secret"/>
  <text x="616" y="837" class="legend-label">Secrets/config</text>
  <line x1="792" y1="831" x2="844" y2="831" class="line-orange"/>
  <text x="858" y="837" class="legend-label">Guardrail path</text>
  <line x1="1040" y1="831" x2="1092" y2="831" class="line"/>
  <text x="1106" y="837" class="legend-label">Request/response path</text>
</svg>
